name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.8
      - uses: actions/configure-pages@v5
      - run: emcmake cmake --preset wasm-release
      - run: cmake --build --preset wasm-release
      - run: ctest --preset wasm-release
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/wasm-release/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
