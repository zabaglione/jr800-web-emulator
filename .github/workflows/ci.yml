name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild and retest all components, ignoring verified receipts
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        preset: [native-debug, native-release]
    uses: ./.github/workflows/ci-check.yml
    with:
      preset: ${{ matrix.preset }}
      full: ${{ inputs.full == true }}

  wasm-debug:
    uses: ./.github/workflows/ci-check.yml
    with:
      preset: wasm-debug
      full: ${{ inputs.full == true }}

  wasm-release:
    uses: ./.github/workflows/ci-check.yml
    with:
      preset: wasm-release
      full: ${{ inputs.full == true }}

  pages:
    needs: [native, wasm-debug, wasm-release]
    if: >-
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/pages.yml
    with:
      revision: ${{ needs.wasm-release.outputs.revision }}
    permissions:
      contents: read
      pages: write
      id-token: write
